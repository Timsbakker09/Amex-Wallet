<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portfolio</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portfolio">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0c0e;
            --card-bg: #16181d;
            --card-border: #23262f;
            --text-primary: #ffffff;
            --text-secondary: #90949d;
            --accent-green: #00c853;
            --accent-red: #ff3b30;
            --accent-blue: #007aff;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100vw;
        }

        header {
            padding-top: calc(var(--safe-top) + 10px);
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            z-index: 10;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c303b, #1a1c23);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }

        .user-info h1 {
            font-size: 15px;
            font-weight: 600;
        }

        .user-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 16px;
        }

        .main-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px calc(var(--safe-bottom) + 90px) 16px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .portfolio-value h2 {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .portfolio-value .amount {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .portfolio-value .returns {
            font-size: 14px;
            font-weight: 600;
        }

        .returns.positive { color: var(--accent-green); }
        .returns.negative { color: var(--accent-red); }

        .chart-container {
            position: relative;
            height: 180px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .timeframes {
            display: flex;
            justify-content: space-between;
            background: #0f1013;
            border-radius: 8px;
            padding: 3px;
            border: 1px solid var(--card-border);
        }

        .tf-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 0;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .tf-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .section-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .asset-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .asset-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .asset-info h4 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .asset-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .asset-prices {
            text-align: right;
        }

        .asset-prices .price {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .asset-prices .change {
            font-size: 12px;
            font-weight: 500;
        }

        nav.bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: calc(55px + var(--safe-bottom));
            background: rgba(11, 12, 14, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--text-primary);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Modal / Dialog */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px calc(var(--safe-bottom) + 20px) 20px;
            border-top: 1px solid var(--card-border);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .close-modal {
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .btn-primary {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .tx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .tx-info h5 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .tx-info p {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .tx-amount {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="profile-section" onclick="openAdmin()">
            <div class="avatar" id="userInitial">TB</div>
            <div class="user-info">
                <h1 id="userNameDisplay">Tim Bakker</h1>
                <p id="userSubDisplay">Hoofdrekening • NL23 RBRK...</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="openAdmin()">⚙️</button>
        </div>
    </header>

    <div class="main-container">
        <!-- TAB 1: PORTFOLIO / BELEGGEN -->
        <div id="tab-portfolio" class="tab-content active">
            <div class="card portfolio-value">
                <h2 id="portfolioTitle">Totaalvermogen</h2>
                <div class="amount" id="totalValueDisplay">€ 0,00</div>
                <div class="returns positive" id="totalReturnDisplay">+ € 0,00 (+0,00%) vandaag</div>
                
                <div class="chart-container">
                    <canvas id="portfolioChart"></canvas>
                </div>

                <div class="timeframes">
                    <button class="tf-btn active" onclick="setTimeframe('1D', this)">1D</button>
                    <button class="tf-btn" onclick="setTimeframe('1W', this)">1W</button>
                    <button class="tf-btn" onclick="setTimeframe('1M', this)">1M</button>
                    <button class="tf-btn" onclick="setTimeframe('1Y', this)">1Y</button>
                    <button class="tf-btn" onclick="setTimeframe('ALL', this)">ALL</button>
                </div>
            </div>

            <div class="section-header">
                <h3>Jouw Posities</h3>
                <button class="icon-btn" style="width:30px; height:30px; font-size:14px;" onclick="openAddAsset()">+</button>
            </div>
            
            <div class="asset-list" id="assetListContainer">
                <!-- Wordt dynamisch gevuld -->
            </div>
        </div>

        <!-- TAB 2: CASH & TEEKS -->
        <div id="tab-cash" class="tab-content">
            <div class="card">
                <h2 style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;">Vrij Saldo</h2>
                <div class="amount" id="cashBalanceDisplay" style="font-size: 28px; font-weight: 700; margin-bottom: 12px;">€ 0,00</div>
                <p style="font-size: 12px; color: var(--text-secondary);">Direct op opneembaar of in te zetten voor orders.</p>
            </div>

            <div class="section-header">
                <h3>Recente Transacties</h3>
                <button class="icon-btn" style="width:30px; height:30px; font-size:14px;" onclick="openAddTx()">+</button>
            </div>
            <div class="card" id="txListContainer">
                <!-- Transacties -->
            </div>
        </div>

        <!-- TAB 3: PROFIEL / INSTELLINGEN -->
        <div id="tab-profile" class="tab-content">
            <div class="card">
                <h3 style="margin-bottom: 15px;">Persoonlijke Gegevens</h3>
                <div class="form-group">
                    <label>Volledige Naam</label>
                    <input type="text" id="settingName" class="form-control" oninput="saveSettings()">
                </div>
                <div class="form-group">
                    <label>IBAN / Rekeningnummer</label>
                    <input type="text" id="settingIban" class="form-control" oninput="saveSettings()">
                </div>
                <div class="form-group">
                    <label>Vrij Cash Saldo (€)</label>
                    <input type="number" id="settingCash" class="form-control" oninput="saveSettings()">
                </div>
                <button class="btn-primary" onclick="switchTab('portfolio')">Opslaan & Bekijken</button>
            </div>
        </div>
    </div>

    <!-- ONDERSTE NAVIGATIE -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('portfolio', this)">
            <svg viewBox="0 0 24 24"><path d="M4 10h3v10H4zm7-7h3v17h-3zm7 13h3v4h-3z"/></svg>
            Beleggen
        </button>
        <button class="nav-item" onclick="switchTab('cash', this)">
            <svg viewBox="0 0 24 24"><path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H3V8h18v10zM5 10h4v2H5z"/></svg>
            Cash & Pas
        </button>
        <button class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            Profiel
        </button>
    </nav>

    <!-- MODAL VOOR POSITIE TOEVOEGEN/BEWERKEN -->
    <div class="modal" id="assetModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Positie bewerken</h3>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>
            <input type="hidden" id="editAssetIndex">
            <div class="form-group">
                <label>Naam / Ticker</label>
                <input type="text" id="modalAssetName" class="form-control" placeholder="bijv. ASML of NVIDIA">
            </div>
            <div class="form-group">
                <label>Aantal stuks</label>
                <input type="number" step="any" id="modalAssetShares" class="form-control">
            </div>
            <div class="form-group">
                <label>Actuele koers (€)</label>
                <input type="number" step="any" id="modalAssetPrice" class="form-control">
            </div>
            <button class="btn-primary" onclick="saveAssetFromModal()">Opslaan</button>
            <button class="btn-primary" style="background: #ff3b30; color: #fff; margin-top: 8px;" onclick="deleteAssetFromModal()">Verwijderen</button>
        </div>
    </div>

    <script>
        // Data-structuur met persistente opslag
        let appData = JSON.parse(localStorage.getItem('tr_portfolio_data')) || {
            name: "Tim Bakker",
            iban: "NL23 RBRK 0987 6543 21",
            cash: 4250.00,
            assets: [
                { name: "ASML Holding", ticker: "ASML.AMS", shares: 12.5, price: 920.40, change: "+2.4%" },
                { name: "NVIDIA Corp", ticker: "NVDA", shares: 45.0, price: 135.20, change: "+4.1%" },
                { name: "Vanguard All-World", ticker: "VWRL", shares: 120.0, price: 124.80, change: "+0.8%" },
                { name: "Apple Inc.", ticker: "AAPL", shares: 25.0, price: 228.50, change: "-0.5%" },
                { name: "Bitcoin", ticker: "BTC", shares: 0.35, price: 88500.00, change: "+3.2%" }
            ],
            transactions: [
                { title: "Stripe Payout", date: "Vandaag, 14:12", amount: "+ € 3.450,00", type: "pos" },
                { title: "ASML Dividend", date: "Gisteren", amount: "+ € 142,50", type: "pos" },
                { title: "Albert Heijn", date: "3 Nov", amount: "- € 42,80", type: "neg" }
            ]
        };

        let currentTimeframe = '1D';
        let portfolioChart = null;

        function saveData() {
            localStorage.setItem('tr_portfolio_data', JSON.stringify(appData));
            updateUI();
        }

        function updateUI() {
            // Header
            document.getElementById('userNameDisplay').innerText = appData.name;
            document.getElementById('userSubDisplay').innerText = `Hoofdrekening • ${appData.iban}`;
            document.getElementById('userInitial').innerText = appData.name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();

            // Settings inputs
            document.getElementById('settingName').value = appData.name;
            document.getElementById('settingIban').value = appData.iban;
            document.getElementById('settingCash').value = appData.cash;

            // Cash tab
            document.getElementById('cashBalanceDisplay').innerText = formatEur(appData.cash);

            // Calculate total portfolio value
            let assetsTotal = appData.assets.reduce((sum, item) => sum + (item.shares * item.price), 0);
            let totalVal = assetsTotal + appData.cash;
            document.getElementById('totalValueDisplay').innerText = formatEur(totalVal);
            document.getElementById('totalReturnDisplay').innerText = `+ € ${(assetsTotal * 0.034).toFixed(2)} (+3.42%) vandaag`;

            // Render assets
            let assetHtml = '';
            appData.assets.forEach((asset, index) => {
                let posVal = asset.shares * asset.price;
                let isPos = !asset.change.startsWith('-');
                assetHtml += `
                    <div class="asset-item" onclick="openEditAsset(${index})">
                        <div class="asset-info">
                            <h4>${asset.name}</h4>
                            <p>${asset.shares} stuks • ${asset.ticker}</p>
                        </div>
                        <div class="asset-prices">
                            <div class="price">€ ${posVal.toLocaleString('nl-NL', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</div>
                            <div class="change" style="color: ${isPos ? 'var(--accent-green)' : 'var(--accent-red)'}">${asset.change} (€ ${asset.price})</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('assetListContainer').innerText = ''; // Reset
            document.getElementById('assetListContainer').innerHTML = assetHtml;

            // Render transactions
            let txHtml = '';
            appData.transactions.forEach((tx) => {
                txHtml += `
                    <div class="tx-item">
                        <div class="tx-info">
                            <h5>${tx.title}</h5>
                            <p>${tx.date}</p>
                        </div>
                        <div class="tx-amount" style="color: ${tx.type === 'pos' ? 'var(--accent-green)' : 'var(--text-primary)'}">
                            ${tx.amount}
                        </div>
                    </div>
                `;
            });
            document.getElementById('txListContainer').innerHTML = txHtml;

            if(portfolioChart) updateChartData();
        }

        function formatEur(val) {
            return '€ ' + val.toLocaleString('nl-NL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
            } else {
                // Find matching nav item
                const navs = document.querySelectorAll('.nav-item');
                if(tabId === 'portfolio') navs[0].classList.add('active');
                if(tabId === 'cash') navs[1].classList.add('active');
                if(tabId === 'profile') navs[2].classList.add('active');
            }
        }

        function saveSettings() {
            appData.name = document.getElementById('settingName').value;
            appData.iban = document.getElementById('settingIban').value;
            appData.cash = parseFloat(document.getElementById('settingCash').value) || 0;
            saveData();
        }

        function openAdmin() {
            switchTab('profile');
        }

        function openEditAsset(index) {
            const asset = appData.assets[index];
            document.getElementById('editAssetIndex').value = index;
            document.getElementById('modalAssetName').value = asset.name;
            document.getElementById('modalAssetShares').value = asset.shares;
            document.getElementById('modalAssetPrice').value = asset.price;
            document.getElementById('assetModal').classList.add('open');
        }

        function openAddAsset() {
            document.getElementById('editAssetIndex').value = '-1';
            document.getElementById('modalAssetName').value = '';
            document.getElementById('modalAssetShares').value = '1';
            document.getElementById('modalAssetPrice').value = '100';
            document.getElementById('assetModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('assetModal').classList.remove('open');
        }

        function saveAssetFromModal() {
            const index = parseInt(document.getElementById('editAssetIndex').value);
            const name = document.getElementById('modalAssetName').value;
            const shares = parseFloat(document.getElementById('modalAssetShares').value) || 0;
            const price = parseFloat(document.getElementById('modalAssetPrice').value) || 0;

            if(index >= 0) {
                appData.assets[index].name = name;
                appData.assets[index].shares = shares;
                appData.assets[index].price = price;
            } else {
                appData.assets.push({ name: name, ticker: "CUSTOM", shares: shares, price: price, change: "+1.5%" });
            }
            saveData();
            closeModal();
        }

        function deleteAssetFromModal() {
            const index = parseInt(document.getElementById('editAssetIndex').value);
            if(index >= 0) {
                appData.assets.splice(index, 1);
                saveData();
            }
            closeModal();
        }

        function setTimeframe(tf, btn) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateChartData();
        }

        function initChart() {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            portfolioChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['09:00', '11:00', '13:00', '15:00', '17:00', '20:00'],
                    datasets: [{
                        data: [42000, 42300, 42150, 42800, 43100, 43450],
                        borderColor: '#00c853',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: true,
                        backgroundColor: function(context) {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                            gradient.addColorStop(0, 'rgba(0, 200, 83, 0.25)');
                            gradient.addColorStop(1, 'rgba(0, 200, 83, 0)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                }
            });
        }

        function updateChartData() {
            let base = appData.assets.reduce((sum, item) => sum + (item.shares * item.price), 0) + appData.cash;
            let mult = currentTimeframe === '1D' ? 0.02 : (currentTimeframe === '1W' ? 0.05 : 0.15);
            portfolioChart.data.datasets[0].data = [
                base * (1 - mult),
                base * (1 - mult * 0.7),
                base * (1 - mult * 0.4),
                base * (1 - mult * 0.2),
                base * (1 - mult * 0.05),
                base
            ];
            portfolioChart.update();
        }

        window.onload = function() {
            initChart();
            updateUI();
        };
    </script>
</body>
</html>
